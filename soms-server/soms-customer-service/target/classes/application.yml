spring:
  application:
    name: service-customer
  profiles:
    active: dev
  config:
    import:
      - nacos:soms-common.yml
      - nacos:soms-redis.yml
      - nacos:service-customer.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: soms
      config:
        server-addr: 127.0.0.1:8848
        namespace: soms
        file-extension: yml
        refresh-enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0


server:
  port: 8010

