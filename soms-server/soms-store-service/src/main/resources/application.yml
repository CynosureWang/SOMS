server:
  port: 8200

spring:
  application:
    name: service-store
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:soms-common.yml
      - optional:nacos:soms-redis.yml
      - optional:nacos:service-store.yml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: soms
      config:
        server-addr: 127.0.0.1:8848
        namespace: soms
        file-extension: yml
        refresh-enabled: true
        shared-configs:
          - data-id: soms-common.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: soms-redis.yml
            group: DEFAULT_GROUP
            refresh: true
        extension-configs:
          - data-id: service-store.yml
            group: DEFAULT_GROUP
            refresh: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms
